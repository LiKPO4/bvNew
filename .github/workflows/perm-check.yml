name: Perm Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect token scopes
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo })
            core.info(`repo permission of token: ${JSON.stringify(res.data.permissions)}`)

      - name: Try create a test release
        run: |
          gh api -X POST repos/${{ github.repository }}/releases \
            -f tag_name=perm-check-tmp \
            -f name=perm-check-tmp \
            -f body=temp-check \
            --jq '.id' || echo "CREATE_RELEASE_FAILED"