name: Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-release:
    name: Build Release Apk
    runs-on: ubuntu-latest
    if: github.repository == 'LiKPO4/bvNew'

    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 缓存 Gradle 依赖与构建缓存，避免每次构建重新下载全部依赖
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Add signing properties
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          if [ -z "$SIGNING_PROPERTIES" ]; then
            echo "::error::The SIGNING_PROPERTIES secret is required for a signed release."
            exit 1
          fi
          printf '%s' "$SIGNING_PROPERTIES" | base64 -d > signing.properties
          test -s signing.properties

      - name: Add jks file
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          if [ -z "$SIGN_KEY" ]; then
            echo "::error::The SIGN_KEY secret is required for a signed release."
            exit 1
          fi
          printf '%s' "$SIGN_KEY" | base64 -d > key.jks
          test -s key.jks

      # debug 变体走「Alpha Build Manually (Without signature)」手动构建，这里只构建 Release，缩短耗时
      - name: Build apk
        run: ./gradlew assembleDefaultRelease

      - name: Read release apk output metadata
        id: apk-meta-release
        uses: juliangruber/read-file-action@v1
        with:
          path: app/build/outputs/apk/default/release/output-metadata.json

      - name: Parse apk infos
        id: apk-infos
        run: |
          echo "release_info_version_code=${{ fromJson(steps.apk-meta-release.outputs.content).elements[0].versionCode }}" >> $GITHUB_ENV
          echo "release_info_version_name=${{ fromJson(steps.apk-meta-release.outputs.content).elements[0].versionName }}" >> $GITHUB_ENV

      - name: Get changelog
        id: changelog
        env:
          RELEASE_SHA: ${{ env.RELEASE_TAG }}
        run: |
          {
            echo "changelog<<EOF"
            echo "LiKPO4/bvNew 正式版本，提供可安装的签名 Release APK。"
            echo
            echo "近期变更："
            git log --pretty=format:"- %s (%h)" -n 30 "$RELEASE_SHA"
            echo
            echo "EOF"
          } >> "$GITHUB_ENV"

      # upload artifacts release

      - name: Archive release build mappings
        uses: actions/upload-artifact@v4
        with:
          name: Release build mappings
          path: app/build/outputs/mapping/defaultRelease

      - name: Archive release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release build artifact
          path: app/build/outputs/apk/default/release/BV_${{ env.release_info_version_code }}_${{ env.release_info_version_name }}_default_universal.apk

      # zip mapping because softprops/action-gh-release can't upload folder

      - name: Zip mapping
        run: zip -rj mapping.zip app/build/outputs/mapping/defaultRelease

      # 用 gh CLI 发布（softprops/action-gh-release 在 fork 仓库上会 403，gh + GITHUB_TOKEN 已验证可行）
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          printf '%s' "$changelog" > release-notes.md
          gh release create "$RELEASE_TAG" \
            --title "${{ env.release_info_version_name }}" \
            --notes-file release-notes.md \
            app/build/outputs/apk/default/release/BV_${{ env.release_info_version_code }}_${{ env.release_info_version_name }}_default_universal.apk \
            mapping.zip
